name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK, CMake and platform
        run: |
          sdkmanager --install \
            "ndk;27.0.12077973" \
            "cmake;3.22.1" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build debug and ASan APKs
        run: ./gradlew assembleDebug assembleAsan --stacktrace --no-configuration-cache

      # Prove the ASan variant is correctly assembled: the runtime must be in
      # the APK under the exact name libhdrstacker.so declares as DT_NEEDED.
      - name: Inspect ASan packaging
        run: |
          APK=$(ls app/build/outputs/apk/asan/*.apk)
          echo "== Native libs inside $APK =="
          unzip -l "$APK" | grep 'lib/' || true
          NDK="$ANDROID_HOME/ndk/27.0.12077973"
          READELF=$(find "$NDK/toolchains" -name llvm-readelf | head -1)
          SO=$(find app/build/intermediates/merged_native_libs/asan -name libhdrstacker.so | head -1)
          echo "== DT_NEEDED of $SO =="
          "$READELF" -d "$SO" | grep NEEDED || true
          echo "== ASan runtimes shipped in this NDK =="
          find "$NDK/toolchains" -name 'libclang_rt.asan*' || true
          echo "== Staged runtimes =="
          find app/build/asanRuntime -type f || true
          if ! unzip -l "$APK" | grep -q 'lib/arm64-v8a/libclang_rt.asan'; then
            echo 'ERROR: ASan runtime missing from the APK'
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hdr-stacker-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload ASan APK
        uses: actions/upload-artifact@v4
        with:
          name: hdr-stacker-asan
          path: app/build/outputs/apk/asan/*.apk
          if-no-files-found: error

      # Unstripped decoder library from the asan variant, used to symbolize
      # the raw addresses in on-device ASan reports offline.
      - name: Upload ASan symbols
        uses: actions/upload-artifact@v4
        with:
          name: hdr-stacker-asan-symbols
          path: app/build/intermediates/merged_native_libs/asan/**/libhdrstacker.so
          if-no-files-found: error
